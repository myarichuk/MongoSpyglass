<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .todo-item { margin-bottom: 0.5em; }
        .completed { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <form id="add-form">
        <input type="text" id="new-todo" placeholder="Add a new task" required>
        <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>

    <script>
        const apiBaseUrl = '/api/todo';

        async function fetchTodos() {
            const response = await fetch(apiBaseUrl);
            const todos = await response.json();
            const list = document.getElementById('todo-list');
            list.innerHTML = '';
            todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = 'todo-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.isCompleted;
                checkbox.onchange = () => toggleTodo(todo);

                const span = document.createElement('span');
                span.textContent = todo.title;
                if (todo.isCompleted) span.className = 'completed';

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = () => deleteTodo(todo.id);

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteBtn);
                list.appendChild(li);
            });
        }

        async function addTodo(event) {
            event.preventDefault();
            const input = document.getElementById('new-todo');
            const title = input.value;
            await fetch(apiBaseUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, isCompleted: false })
            });
            input.value = '';
            fetchTodos();
        }

        async function toggleTodo(todo) {
            await fetch(`${apiBaseUrl}/${todo.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...todo, isCompleted: !todo.isCompleted })
            });
            fetchTodos();
        }

        async function deleteTodo(id) {
            await fetch(`${apiBaseUrl}/${id}`, { method: 'DELETE' });
            fetchTodos();
        }

        document.getElementById('add-form').addEventListener('submit', addTodo);
        fetchTodos();
    </script>
</body>
</html>
